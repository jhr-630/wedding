<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>결혼식 체크리스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: single readable column, sticky progress bar, section jump chips, check rows grouped by section */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --ink:#1d2433; --muted:#667085; --line:#e3e6ec;
  --accent:#a8566a; --accent-soft:#f6e8ec; --done:#9aa3b2;
  --display:"Gowun Batang", "Nanum Myeongjo", serif;
  --body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14171e; --surface:#1c2029; --ink:#e8eaf0; --muted:#9aa2b3; --line:#2b313d;
  --accent:#e49aae; --accent-soft:#3a2730; --done:#6b7385; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171e; --surface:#1c2029; --ink:#e8eaf0; --muted:#9aa2b3; --line:#2b313d;
  --accent:#e49aae; --accent-soft:#3a2730; --done:#6b7385; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;margin:0}
.wrap{max-width:720px;margin:0 auto;padding:32px 16px 80px}
header h1{font-family:var(--display);font-weight:700;font-size:1.9rem;line-height:1.25;margin:0 0 6px;text-wrap:balance}
header p{color:var(--muted);margin:0;font-size:.92rem}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;margin-top:18px;border-bottom:1px solid var(--line)}
.prog{display:flex;align-items:center;gap:12px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.track{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.fill{height:100%;width:0;background:var(--accent);transition:width .25s}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
.chips a{flex:none;font-size:.8rem;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;white-space:nowrap}
.chips a:hover,.chips a:focus-visible{border-color:var(--accent);outline:none}
.chips a.complete{color:var(--done)}
.group-label{font-size:.72rem;letter-spacing:.12em;color:var(--accent);font-weight:600;margin:36px 0 4px}
section{margin-top:22px;scroll-margin-top:110px}
section h2{font-family:var(--display);font-size:1.25rem;margin:0;display:flex;align-items:baseline;gap:10px}
section h2 .cnt{font-family:var(--body);font-size:.78rem;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
section .lead{color:var(--muted);font-size:.86rem;margin:2px 0 8px}
ul{list-style:none;margin:8px 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px}
li+li{border-top:1px solid var(--line)}
label{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;cursor:pointer}
input[type=checkbox]{appearance:none;flex:none;width:20px;height:20px;margin-top:2px;border:1.5px solid var(--muted);border-radius:5px;display:grid;place-content:center;cursor:pointer;background:var(--surface)}
input[type=checkbox]::after{content:"";width:10px;height:6px;border-left:2px solid var(--surface);border-bottom:2px solid var(--surface);transform:rotate(-45deg) translate(1px,-1px);opacity:0}
input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
input[type=checkbox]:checked::after{opacity:1}
input[type=checkbox]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.txt{min-width:0}
.t{display:block}
.n{display:block;color:var(--muted);font-size:.83rem;margin-top:1px}
.who{display:inline-block;font-size:.7rem;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:2px;white-space:nowrap}
li.on .t{color:var(--done);text-decoration:line-through}
li.on .n,li.on .who{opacity:.55}
.foot{margin-top:40px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:.85rem;color:var(--muted)}
button{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 14px;cursor:pointer}
button:hover,button:focus-visible{border-color:var(--accent);outline:none}
button.danger{border-color:var(--accent);color:var(--accent)}
.tabs{display:inline-flex;gap:4px;margin-top:14px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.tab{border:0;background:transparent;border-radius:7px;padding:7px 18px;font-size:.92rem;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--surface);font-weight:600}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header p#lead{margin-top:10px}
.from{display:inline-block;font-size:.7rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:2px;white-space:nowrap}
li.leaving{opacity:.4;transition:opacity .3s}
.empty{margin:8px 0 0;padding:12px 14px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:.86rem}
.group-label[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>결혼식 체크리스트</h1>
    <div class="tabs" id="tabs" role="tablist" aria-label="체크리스트 선택">
      <button type="button" class="tab" role="tab" data-tab="pre" id="tab-pre">본식 전</button>
      <button type="button" class="tab" role="tab" data-tab="day" id="tab-day">본식 당일</button>
    </div>
    <p id="lead"></p>
  </header>
  <div class="bar">
    <div class="prog"><div class="track"><div class="fill" id="fill"></div></div><span id="ptxt">0 / 0</span></div>
    <nav class="chips" id="chips" aria-label="섹션 바로가기"></nav>
  </div>
  <main id="list" role="tabpanel"></main>
  <div class="foot">
    <button type="button" id="openAll">체크 해제한 항목만 보기</button>
    <button type="button" id="reset">이 탭 초기화</button>
    <span id="confirm" hidden>이 탭의 체크를 처음 상태로 되돌릴까요? <button type="button" class="danger" id="yes">초기화</button> <button type="button" id="no">취소</button></span>
  </div>
</div>

let state={};
try{state=JSON.parse(localStorage.getItem("wd-check")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("wd-check",JSON.stringify(state))}catch(e){}};
const esc=t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const TABS={
  pre:{data:PRE,pref:"",lead:"체크하면 맨 아래 ‘완료된 항목’으로 옮겨지고, 체크를 풀면 원래 자리로 돌아가요. 체크한 항목은 이 기기에 저장돼요."},
  day:{data:DAY,pref:"",lead:"본식스냅 · 서브스냅 · DVD · 아이폰스냅 · 사회자 · 양가 축의대 기준. 체크한 항목은 이 기기에 저장돼요."}
};
const list=document.getElementById("list"), chips=document.getElementById("chips");
let onlyOpen=false, cur="pre";
const isOn=(key,sec)=>key in state?!!state[key]:!!sec.done;

function itemLi(it,key,sec,from){
  const li=document.createElement("li");
  const note=it[1]?it[1].split("\n").map(l=>`<span class="n">${esc(l)}</span>`).join(""):"";
  li.innerHTML=`<label for="${key}"><input type="checkbox" id="${key}"><span class="txt"><span class="t">${esc(it[0])}${it[2]?`<span class="who">${it[2]}</span>`:""}${from?`<span class="from">${from}</span>`:""}</span>${note}</span></label>`;
  const cb=li.querySelector("input");cb.checked=isOn(key,sec);li.classList.toggle("on",cb.checked);
  cb.addEventListener("change",()=>{
    state[key]=cb.checked;li.classList.toggle("on",cb.checked);save();
    if(moves()){li.classList.add("leaving");setTimeout(()=>{const y=window.scrollY;render();window.scrollTo(0,y)},350)}else update();
  });
  return li;
}
const moves=()=>TABS[cur].data.some(s=>s.done);
function render(){
  list.innerHTML="";chips.innerHTML="";let lastGroup=null;
  const data=TABS[cur].data, mv=moves(), moved=[];
  if(mv)data.forEach(sec=>{if(!sec.done)sec.items.forEach((it,i)=>{const key=sec.id+"-"+i;if(isOn(key,sec))moved.push([it,key,sec])})});
  data.forEach(sec=>{
    if(!sec.g){lastGroup=null}else if(sec.g!==lastGroup){const d=document.createElement("div");d.className="group-label";d.textContent=sec.g;list.appendChild(d);lastGroup=sec.g}
    const s=document.createElement("section");s.id=sec.id;
    s.innerHTML=`<h2>${sec.h}<span class="cnt"></span></h2>${sec.lead?`<p class="lead">${sec.lead}</p>`:""}`;
    const ul=document.createElement("ul");
    if(mv&&sec.done)moved.forEach(([it,key,src])=>ul.appendChild(itemLi(it,key,src,src.h)));
    sec.items.forEach((it,i)=>{
      const key=sec.id+"-"+i;
      if(mv&&!sec.done&&isOn(key,sec))return;
      ul.appendChild(itemLi(it,key,sec,null));
    });
    if(!ul.children.length){const e=document.createElement("p");e.className="empty";e.textContent="모두 완료했어요. 체크한 항목은 ‘완료된 항목’에 있어요.";s.appendChild(e)}else s.appendChild(ul);
    list.appendChild(s);
    const a=document.createElement("a");a.href="#"+sec.id;a.textContent=sec.h;a.dataset.id=sec.id;
    a.addEventListener("click",e=>{e.preventDefault();s.scrollIntoView({behavior:"smooth"})});
    chips.appendChild(a);
  });
  document.getElementById("lead").textContent=TABS[cur].lead;
  document.querySelectorAll(".tab").forEach(t=>{const on=t.dataset.tab===cur;t.setAttribute("aria-selected",on);t.tabIndex=on?0:-1});
  update();
}
function update(){
  let tot=0,done=0;const mv=moves();
  TABS[cur].data.forEach(sec=>{
    const s=document.getElementById(sec.id), boxes=[...s.querySelectorAll("input")];
    const d=boxes.filter(b=>b.checked).length;
    const cnt=s.querySelector(".cnt"), chip=chips.querySelector(`[data-id="${sec.id}"]`);
    if(mv){
      const left=boxes.length-d;
      cnt.textContent=sec.done?`${d}개`:(left?`${left}개 남음`:"완료");
      chip.classList.toggle("complete",!sec.done&&left===0);
    }else{
      cnt.textContent=`${d}/${boxes.length}`;
      chip.classList.toggle("complete",d===boxes.length);
    }
    s.querySelectorAll("li").forEach(li=>li.hidden=onlyOpen&&li.classList.contains("on"));
    s.hidden=onlyOpen&&boxes.length-d===0;
  });
  TABS[cur].data.forEach(sec=>sec.items.forEach((_,i)=>{tot++;if(isOn(sec.id+"-"+i,sec))done++}));
  document.querySelectorAll(".group-label").forEach(g=>{
    let n=g.nextElementSibling,any=false;while(n&&n.tagName==="SECTION"){if(!n.hidden)any=true;n=n.nextElementSibling}
    g.hidden=!any;
  });
  document.getElementById("fill").style.width=(tot?done/tot*100:0)+"%";
  document.getElementById("ptxt").textContent=`${done} / ${tot}`;
}
function setTab(t){cur=t;try{localStorage.setItem("wd-tab",t)}catch(e){}render();window.scrollTo(0,0)}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>setTab(t.dataset.tab)));
document.getElementById("tabs").addEventListener("keydown",e=>{
  if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight")return;
  const n=cur==="pre"?"day":"pre";setTab(n);document.querySelector(`.tab[data-tab="${n}"]`).focus();
});
const h=location.hash.replace("#","");
const SWITCH=new Date(2026,11,5);// 12월 5일 0시(기기 시간) 이후로는 열 때 본식 당일 탭부터
if(h==="pre"||h==="day")cur=h;
else if(new Date()>=SWITCH)cur="day";
else{try{const s=localStorage.getItem("wd-tab");if(s==="pre"||s==="day")cur=s}catch(e){}}
render();

const openBtn=document.getElementById("openAll");
openBtn.onclick=()=>{onlyOpen=!onlyOpen;openBtn.textContent=onlyOpen?"전체 항목 보기":"체크 해제한 항목만 보기";update()};
const conf=document.getElementById("confirm");
document.getElementById("reset").onclick=()=>conf.hidden=false;
document.getElementById("no").onclick=()=>conf.hidden=true;
document.getElementById("yes").onclick=()=>{
  TABS[cur].data.forEach(sec=>sec.items.forEach((_,i)=>{delete state[sec.id+"-"+i]}));
  save();conf.hidden=true;render();
};
</script>
