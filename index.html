/* Layout: single readable column, sticky progress bar, section jump chips, check rows grouped by section */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --ink:#1d2433; --muted:#667085; --line:#e3e6ec;
  --accent:#a8566a; --accent-soft:#f6e8ec; --done:#9aa3b2;
  --bride:#7a4bb5; --bride-soft:#efe7f9; --groom:#2f62b8; --groom-soft:#e4edfb;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --accent:#e49aae; --accent-soft:#3a2730; --done:#6b7385; --bride:#c4a3f0; --bride-soft:#30264a; --groom:#93b6f2; --groom-soft:#1f2c47; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171e; --surface:#1c2029; --ink:#e8eaf0; --muted:#9aa2b3; --line:#2b313d;
  --accent:#e49aae; --accent-soft:#3a2730; --done:#6b7385; --bride:#c4a3f0; --bride-soft:#30264a; --groom:#93b6f2; --groom-soft:#1f2c47; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;margin:0}
.wrap{max-width:720px;margin:0 auto;padding:32px 16px 80px}

button:disabled{opacity:.35;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.erow{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 12px;flex-wrap:wrap}

.frow{display:flex;gap:8px;flex-wrap:wrap}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.editbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}

@media (prefers-reduced-motion:reduce){.fill{transition:none}}

    <button type="button" id="openAll">체크 해제한 항목만 보기</button>
    <button type="button" id="reset">이 탭 체크 초기화</button>
    <span id="confirm" hidden>이 탭의 체크를 처음 상태로 되돌릴까요? <button type="button" class="danger" id="yes">초기화</button> <button type="button" id="no">취소</button></span>
  </div>
</div>
<div class="editbar" id="editbar" hidden><span id="dirty">편집 중</span><button type="button" id="cancelEdit">취소</button><button type="button" class="primary" id="saveEdit">편집 완료</button></div>`;
const $=id=>document.getElementById(id);
const list=$("list"), chips=$("chips");

/* ---------- legacy checks from the earlier version of this page ---------- */
const legacy=parse(LS.get("wd-check"));
function applyLegacy(){
  if(!legacy||DATA.m)return;
  ORDER.forEach(k=>DATA.tabs[k].secs.forEach(s=>s.items.forEach(it=>{if(it.lk&&it.lk in legacy)it.on=!!legacy[it.lk]})));
}
applyLegacy();

/* ---------- storage ---------- */
function loadLocal(){
  const l=parse(LS.get("wd-data"));
  if(l&&l.base===ORIG_REV&&l.data){DATA=l.data}
}
function saveLocal(){const d=JSON.parse(JSON.stringify(DATA));d.rev=ORIG_REV;LS.set("wd-data",JSON.stringify({base:ORIG_REV,data:d}))}
function setStatus(t){$("status").textContent=t||""}
function stashView(){SS.set("wd-view",JSON.stringify({tab:cur,y:window.scrollY}))}
function buildDoc(){
  const style=$("wd-style").textContent, app=$("wd-app").textContent;
  const json=JSON.stringify(DATA).replace(/</g,"\\u003c");
  return SKEL+"\n"+HEAD_HTML+'\n<style id="wd-style">'+style+'</style>\n<div id="root"></div>\n<script type="application/json" id="wd-data">'+json+"<\/script>\n<script id=\"wd-app\">"+app+"<\/script>\n</body></html>";
}
function persist(now){
  if(mode==="local"||mode==="readonly"){saveLocal();setStatus(mode==="readonly"?"보기 전용 링크라 이 기기에만 저장돼요.":"이 기기에 저장됐어요.");return}
  clearTimeout(timer);setStatus("저장 대기 중…");
  timer=setTimeout(publishNow,now?0:1500);
}
async function publishNow(){
  if(mode==="pending"){timer=setTimeout(publishNow,500);return}
  if(mode!=="shared"){persist();return}
  const prev=DATA.rev;DATA.rev=prev+1;DATA.m=1;
  stashView();SS.del("wd-draft");setStatus("저장 중…");
  try{await art.publish(buildDoc());setStatus("저장됐어요.")}
  catch(e){
    DATA.rev=prev;const c=e&&e.code;
    if(c==="conflict"){setStatus("다른 기기에서 먼저 저장돼서 새 내용을 불러와요.");return}
    if(c==="rate_limited"){setStatus("잠시 후 다시 저장할게요.");timer=setTimeout(publishNow,5000);return}
    mode=(c==="not_writer"||c==="not_granted"||c==="consent_required")?"readonly":"local";
    saveLocal();
    setStatus(mode==="readonly"?"보기 전용 링크라 이 기기에만 저장돼요.":"페이지에 저장하지 못해서 이 기기에만 저장했어요.");
    if(mode==="readonly"){$("editBtn").hidden=true}
  }
}

/* ---------- helpers ---------- */
const T=()=>DATA.tabs[cur];
const whoCls=w=>(w==="신부"||/^신부측/.test(w))?"bride":(w==="신랑"||/^신랑측/.test(w))?"groom":"";
const whoTag=w=>w?`<span class="who ${whoCls(w)}">${esc(w)}</span>`:"";
const notes=n=>n?n.split("\n").map(l=>`<span class="n">${esc(l)}</span>`).join(""):"";
const moves=()=>!editing&&T().secs.some(s=>s.done);

/* ---------- normal view ---------- */
function itemLi(it,from){
  const li=document.createElement("li");li.className=it.on?"on":"";
  li.innerHTML=`<label class="chk" for="c-${it.id}"><input type="checkbox" id="c-${it.id}"${it.on?" checked":""}><span class="txt"><span class="t">${esc(it.t)}${whoTag(it.w)}${from?`<span class="from">${esc(from)}</span>`:""}</span>${notes(it.n)}</span></label>`;
  const cb=li.querySelector("input");
  cb.addEventListener("change",()=>{
    it.on=cb.checked;li.classList.toggle("on",it.on);persist();
    if(moves()){li.classList.add("leaving");setTimeout(()=>{const y=window.scrollY;render();window.scrollTo(0,y)},350)}else update();
  });
  return li;
}
function render(){
  list.innerHTML="";chips.innerHTML="";let last=null;
  const secs=T().secs, mv=moves(), moved=[];
  if(mv)secs.forEach(s=>{if(!s.done)s.items.forEach(it=>{if(it.on)moved.push([it,s])})});
  secs.forEach((s,si)=>{
    if(!s.g){last=null}else if(s.g!==last){const d=document.createElement("div");d.className="group-label";d.textContent=s.g;list.appendChild(d);last=s.g}
    const el=document.createElement("section");el.id="s-"+s.id;
    if(editing){renderEditSection(el,s,si)}
    else{
      el.innerHTML=`<h2>${esc(s.h)}<span class="cnt"></span></h2>${s.lead?`<p class="lead">${esc(s.lead)}</p>`:""}`;
      const ul=document.createElement("ul");
      if(mv&&s.done)moved.forEach(([it,src])=>ul.appendChild(itemLi(it,src.h)));
      s.items.forEach(it=>{if(mv&&!s.done&&it.on)return;ul.appendChild(itemLi(it,null))});
      if(!ul.children.length){const e=document.createElement("p");e.className="empty";e.textContent=s.items.length?"모두 완료했어요. 체크한 항목은 ‘완료된 항목’에 있어요.":"아직 항목이 없어요. 위의 ‘편집’에서 추가할 수 있어요.";el.appendChild(e)}else el.appendChild(ul);
    }
    list.appendChild(el);
    const a=document.createElement("a");a.href="#s-"+s.id;a.textContent=s.h;a.dataset.id=s.id;
    a.addEventListener("click",e=>{e.preventDefault();el.scrollIntoView({behavior:"smooth"})});
    chips.appendChild(a);
  });
  if(editing){
    if(form&&form.kind==="newsec")list.appendChild(secForm(null));
    else{const b=document.createElement("button");b.type="button";b.className="add addsec";b.dataset.act="newsec";b.textContent="+ 섹션 추가";list.appendChild(b)}
  }
  ORDER.forEach(k=>{const b=$("tab-"+k);b.textContent=DATA.tabs[k].label;const on=k===cur;b.setAttribute("aria-selected",on);b.tabIndex=on?0:-1});
  $("lead").textContent=editing?"편집 중이에요. 항목을 고치고 아래 ‘편집 완료’를 누르면 저장돼요.":T().lead||"";
  document.body.classList.toggle("editing",editing);
  $("editbar").hidden=!editing;$("foot").hidden=editing;
  $("editBtn").textContent=editing?"편집 중":"편집";$("editBtn").disabled=editing;
  update();
  const f=list.querySelector("form input");if(f)f.focus();
}
function update(){
  let tot=0,done=0;const mv=moves();
  T().secs.forEach(s=>{
    s.items.forEach(it=>{tot++;if(it.on)done++});
    const el=$("s-"+s.id);if(!el)return;
    const cnt=el.querySelector(".cnt"),chip=chips.querySelector(`[data-id="${s.id}"]`);
    const boxes=[...el.querySelectorAll("input[type=checkbox]")],d=boxes.filter(b=>b.checked).length,left=boxes.length-d;
    if(editing){if(cnt)cnt.textContent=`${s.items.length}개`;chip.classList.remove("complete");return}
    if(mv){cnt.textContent=s.done?`${d}개`:(left?`${left}개 남음`:"완료");chip.classList.toggle("complete",!s.done&&left===0)}
    else{cnt.textContent=`${d}/${boxes.length}`;chip.classList.toggle("complete",boxes.length>0&&left===0)}
    el.querySelectorAll("li").forEach(li=>li.hidden=onlyOpen&&li.classList.contains("on"));
    el.hidden=onlyOpen&&boxes.length>0&&left===0;
  });
  document.querySelectorAll(".group-label").forEach(g=>{let n=g.nextElementSibling,any=false;while(n&&n.tagName==="SECTION"){if(!n.hidden)any=true;n=n.nextElementSibling}g.hidden=!any});
  $("fill").style.width=(tot?done/tot*100:0)+"%";$("ptxt").textContent=`${done} / ${tot}`;
  if(editing){const changed=JSON.stringify(DATA)!==snap;$("dirty").textContent=changed?"저장 안 된 변경이 있어요":"편집 중";SS.set("wd-draft",JSON.stringify({base:ORIG_REV,data:DATA,snap,tab:cur}))}
}

/* ---------- edit view ---------- */
function btn(act,label,extra){return `<button type="button" data-act="${act}"${extra||""}>${label}</button>`}
function delBtn(key,act,attrs){const on=armed===key;return `<button type="button" data-act="${act}" ${attrs} class="${on?"danger":""}">${on?"정말 삭제":"삭제"}</button>`}
function renderEditSection(el,s,si){
  const secs=T().secs;
  if(form&&form.kind==="sec"&&form.s===si){el.appendChild(secForm(s))}
  else el.innerHTML=`<div class="sechead"><h2>${esc(s.h)}<span class="cnt"></span></h2><span class="tools">${btn("secup","↑",` data-s="${si}" aria-label="섹션 위로"${si===0?" disabled":""}`)}${btn("secdown","↓",` data-s="${si}" aria-label="섹션 아래로"${si===secs.length-1?" disabled":""}`)}${btn("secedit","이름 수정",` data-s="${si}"`)}${s.done?"":delBtn("sec"+s.id,"secdel",`data-s="${si}"`)}</span></div>${s.lead?`<p class="lead">${esc(s.lead)}</p>`:""}`;
  const ul=document.createElement("ul");
  s.items.forEach((it,i)=>{
    const li=document.createElement("li");
    if(form&&form.kind==="item"&&form.s===si&&form.i===i){li.appendChild(itemForm(it,si))}
    else li.innerHTML=`<div class="erow"><span class="txt"><span class="t">${esc(it.t)}${whoTag(it.w)}</span>${notes(it.n)}</span><span class="tools">${btn("up","↑",` data-s="${si}" data-i="${i}" aria-label="위로"${i===0?" disabled":""}`)}${btn("down","↓",` data-s="${si}" data-i="${i}" aria-label="아래로"${i===s.items.length-1?" disabled":""}`)}${btn("edit","수정",` data-s="${si}" data-i="${i}"`)}${delBtn("it"+it.id,"del",`data-s="${si}" data-i="${i}"`)}</span></div>`;
    ul.appendChild(li);
  });
  if(form&&form.kind==="new"&&form.s===si){const li=document.createElement("li");li.appendChild(itemForm(null,si));ul.appendChild(li)}
  if(ul.children.length)el.appendChild(ul);
  if(!(form&&form.kind==="new"&&form.s===si)){const b=document.createElement("button");b.type="button";b.className="add";b.dataset.act="new";b.dataset.s=si;b.textContent="+ 항목 추가";el.appendChild(b)}
}
function itemForm(it,si){
  const secs=T().secs, f=document.createElement("form");f.className="iform";
  const opts=[...new Set(WHO.concat(ORDER.flatMap(k=>DATA.tabs[k].secs.flatMap(s=>s.items.map(x=>x.w).filter(Boolean)))))];
  f.innerHTML=`<label for="f-t">항목<input id="f-t" name="t" required value="${esc(it?it.t:"")}" autocomplete="off"></label>
  <label for="f-n">메모 <small>(줄을 바꾸면 여러 줄로 보여요)</small><textarea id="f-n" name="n" rows="3">${esc(it&&it.n||"")}</textarea></label>
  <div class="frow2"><label for="f-w">담당<select id="f-w" name="w"><option value="">없음</option>${opts.map(o=>`<option${it&&it.w===o?" selected":""}>${esc(o)}</option>`).join("")}</select></label>
  <label for="f-s">섹션<select id="f-s" name="s">${secs.map((s,k)=>`<option value="${k}"${k===si?" selected":""}>${esc(s.h)}</option>`).join("")}</select></label></div>
  <div class="frow"><button type="submit" class="primary">${it?"저장":"추가"}</button><button type="button" data-act="cancel">취소</button></div>`;
  f.addEventListener("submit",e=>{
    e.preventDefault();const fd=new FormData(f),t=String(fd.get("t")).trim();if(!t)return;
    const n=String(fd.get("n")).replace(/\r/g,"").trim(),w=String(fd.get("w")),to=+fd.get("s");
    let obj=it||{id:uid(),on:!!secs[to].done};
    obj.t=t;if(n)obj.n=n;else delete obj.n;if(w)obj.w=w;else delete obj.w;
    if(it){if(to!==si){secs[si].items.splice(form.i,1);secs[to].items.push(obj)}}
    else secs[to].items.push(obj);
    form=null;render();
  });
  return f;
}
function secForm(s){
  const f=document.createElement("form");f.className="iform";
  f.innerHTML=`<label for="f-h">섹션 이름<input id="f-h" name="h" required value="${esc(s?s.h:"")}" autocomplete="off"></label>
  <label for="f-l">설명 <small>(선택)</small><input id="f-l" name="l" value="${esc(s&&s.lead||"")}" autocomplete="off"></label>
  <div class="frow"><button type="submit" class="primary">${s?"저장":"섹션 추가"}</button><button type="button" data-act="cancel">취소</button></div>`;
  f.addEventListener("submit",e=>{
    e.preventDefault();const fd=new FormData(f),h=String(fd.get("h")).trim(),l=String(fd.get("l")).trim();if(!h)return;
    if(s){s.h=h;if(l)s.lead=l;else delete s.lead}
    else{const secs=T().secs,ns={id:"s"+uid().slice(1),h,items:[]};if(l)ns.lead=l;const di=secs.findIndex(x=>x.done);if(di<0)secs.push(ns);else secs.splice(di,0,ns)}
    form=null;render();
  });
  return f;
}
list.addEventListener("click",e=>{
  const b=e.target.closest("button[data-act]");if(!b||!editing)return;
  const act=b.dataset.act,si=+b.dataset.s,i=+b.dataset.i,secs=T().secs,sw=(a,x,y)=>{const t=a[x];a[x]=a[y];a[y]=t};
  if(act!=="del"&&act!=="secdel")armed=null;
  switch(act){
    case "up":sw(secs[si].items,i,i-1);break;
    case "down":sw(secs[si].items,i,i+1);break;
    case "secup":sw(secs,si,si-1);break;
    case "secdown":sw(secs,si,si+1);break;
    case "edit":form={kind:"item",s:si,i};break;
    case "new":form={kind:"new",s:si};break;
    case "secedit":form={kind:"sec",s:si};break;
    case "newsec":form={kind:"newsec"};break;
    case "cancel":form=null;break;
    case "del":{const k="it"+secs[si].items[i].id;if(armed===k){secs[si].items.splice(i,1);armed=null}else{armed=k;setTimeout(()=>{if(armed===k){armed=null;render()}},3000)}break}
    case "secdel":{const k="sec"+secs[si].id;if(armed===k){secs.splice(si,1);armed=null}else{armed=k;setTimeout(()=>{if(armed===k){armed=null;render()}},3000)}break}
    default:return;
  }
  const y=window.scrollY;render();window.scrollTo(0,y);
});
let pendingSave=false;
function startEdit(){if(timer){clearTimeout(timer);timer=null;pendingSave=true}editing=true;form=null;armed=null;snap=JSON.stringify(DATA);render()}
function endEdit(save){
  const changed=JSON.stringify(DATA)!==snap;
  if(!save&&changed)DATA=JSON.parse(snap);
  editing=false;form=null;armed=null;snap=null;SS.del("wd-draft");render();
  if((save&&changed)||pendingSave){pendingSave=false;persist(true)}
}
$("editBtn").onclick=startEdit;
$("saveEdit").onclick=()=>endEdit(true);
$("cancelEdit").onclick=()=>endEdit(false);

/* ---------- tabs & footer ---------- */
function setTab(t){cur=t;LS.set("wd-tab",t);form=null;armed=null;render();window.scrollTo(0,0)}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>setTab(t.dataset.tab)));
$("tabs").addEventListener("keydown",e=>{
  if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight")return;
  const k=ORDER.indexOf(cur),n=ORDER[(k+(e.key==="ArrowRight"?1:ORDER.length-1))%ORDER.length];setTab(n);$("tab-"+n).focus();
});
$("openAll").onclick=()=>{onlyOpen=!onlyOpen;$("openAll").textContent=onlyOpen?"전체 항목 보기":"체크 해제한 항목만 보기";update()};
$("reset").onclick=()=>$("confirm").hidden=false;
$("no").onclick=()=>$("confirm").hidden=true;
$("yes").onclick=()=>{T().secs.forEach(s=>s.items.forEach(it=>it.on=!!s.done));$("confirm").hidden=true;render();persist()};

/* ---------- start ---------- */
const SWITCH=new Date(2026,11,5); // 12월 5일 0시(기기 시간)부터 열 때 본식 당일 탭부터
const view=parse(SS.get("wd-view"));SS.del("wd-view");
const draft=parse(SS.get("wd-draft"));
const h=location.hash.replace("#","");
if(view&&view.tab in DATA.tabs)cur=view.tab;
else if(h in DATA.tabs)cur=h;
else if(new Date()>=SWITCH)cur="day";
else{const s=LS.get("wd-tab");if(s in DATA.tabs)cur=s}

function boot(){
  if(draft&&draft.base===ORIG_REV&&draft.data){DATA=draft.data;snap=draft.snap;editing=true;if(draft.tab in DATA.tabs)cur=draft.tab}
  render();
  if(view)window.scrollTo(0,view.y||0);
}
if(!(window.claude&&typeof window.claude.use==="function")){mode="local";loadLocal();applyLegacy();boot();setStatus("이 기기에 저장돼요.")}
else{
  boot();
  window.claude.use("artifact").then(a=>{
    if(a){art=a;mode="shared";setStatus("체크와 편집 내용은 이 페이지에 저장돼서 다른 기기에서도 보여요.")}
    else{mode="local";const before=JSON.stringify(DATA);loadLocal();if(!editing&&JSON.stringify(DATA)!==before)render();setStatus("이 화면에서는 이 기기에만 저장돼요.")}
  },()=>{mode="local";setStatus("이 화면에서는 이 기기에만 저장돼요.")});
}
})();
</script>
</body></html>
